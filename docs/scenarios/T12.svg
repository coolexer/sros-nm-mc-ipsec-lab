<text x="887.0" y="282.5" font-size="16" fill="#2563eb" text-anchor="middle">clear inner IP</text>
<path d="M 971.6666666666667 267 h 20" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="996.6666666666667" y="232" width="163.33333333333334" height="70" rx="9" fill="#f1f5ff" stroke="#2563eb" stroke-width="2"/>
<text x="1078.3333333333335" y="261.5" font-size="16" fill="#2563eb" text-anchor="middle">MME</text>
<text x="1078.3333333333335" y="282.5" font-size="16" fill="#2563eb" text-anchor="middle">10.200.0.10</text>
<text x="40" y="337" font-size="15" fill="#64748b" text-anchor="start">ESP: eNB → gateway 198.51.100.1; after ISA decryption: inner IP → 10.200.0.10</text>
<text x="40" y="382" font-size="19" fill="#17233c" text-anchor="start">Return  MME to eNB</text>
