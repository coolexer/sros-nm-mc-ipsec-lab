<text x="504.33333333333337" y="453.5" font-size="16" fill="#2563eb" text-anchor="middle">private ingress</text>
<path d="M 589.0 438 h 20" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="614.0" y="403" width="163.33333333333334" height="70" rx="9" fill="#f1f5ff" stroke="#2563eb" stroke-width="2"/>
<text x="695.6666666666666" y="432.5" font-size="16" fill="#2563eb" text-anchor="middle">seg2</text>
<text x="695.6666666666666" y="453.5" font-size="16" fill="#2563eb" text-anchor="middle">ISA encrypt</text>
<path d="M 780.3333333333334 438 h 20" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="805.3333333333334" y="403" width="163.33333333333334" height="70" rx="9" fill="#f1f5ff" stroke="#2563eb" stroke-width="2"/>
<text x="887.0" y="432.5" font-size="16" fill="#2563eb" text-anchor="middle">ipmpls Base</text>
<text x="887.0" y="453.5" font-size="16" fill="#2563eb" text-anchor="middle">ESP to eNB</text>
<path d="M 971.6666666666667 438 h 20" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="996.6666666666667" y="403" width="163.33333333333334" height="70" rx="9" fill="#f1f5ff" stroke="#2563eb" stroke-width="2"/>
<text x="1078.3333333333335" y="432.5" font-size="16" fill="#2563eb" text-anchor="middle">eNB1 / eNB2</text>
<text x="1078.3333333333335" y="453.5" font-size="16" fill="#2563eb" text-anchor="middle">10.100.x.1</text>
<text x="40" y="507" font-size="15" fill="#64748b" text-anchor="start">Inner IP reaches the OA before encryption; the encrypted return packet uses the public Base instance</text>
<text x="40" y="548" font-size="16" fill="#2563eb" text-anchor="start">Public shunt: seg1 → seg2; dedicated peer next-hop, no decryption on the standby</text>
<text x="40" y="577" font-size="16" fill="#2563eb" text-anchor="start">Private shunt: seg1 → seg2; inner IP is forwarded to the active ISA</text>
<text x="40" y="620" font-size="16" fill="#64748b" text-anchor="start">Both public and private shunts cross LAG 12 on surviving member B. Control-plane reachability alone cannot prove this</text>
<text x="40" y="643" font-size="16" fill="#64748b" text-anchor="start">data path</text>
<text x="40" y="681" font-size="16" fill="#14804a" text-anchor="start">LAG 12 member A: DOWN    member B: UP    compact: both on MDA 1/1</text>
</svg>