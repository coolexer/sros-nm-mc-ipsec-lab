<text x="121.66666666666667" y="453.5" font-size="16" fill="#2563eb" text-anchor="middle">10.200.0.10</text>
<path d="M 206.33333333333334 438 h 20" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="231.33333333333334" y="403" width="163.33333333333334" height="70" rx="9" fill="#f1f5ff" stroke="#2563eb" stroke-width="2"/>
<text x="313.0" y="432.5" font-size="16" fill="#2563eb" text-anchor="middle">ipmpls VPRN</text>
<text x="313.0" y="453.5" font-size="16" fill="#2563eb" text-anchor="middle">10.100.x.1 /32</text>
