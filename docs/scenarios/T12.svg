<text x="600.0" y="150.0" font-size="16" fill="#14804a" text-anchor="middle">OA  encrypt / decrypt</text>
<rect x="820" y="92" width="340" height="85" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="990.0" y="129.0" font-size="16" fill="#64748b" text-anchor="middle">seg3  DS  priority 200</text>
<text x="990.0" y="150.0" font-size="16" fill="#64748b" text-anchor="middle">standby</text>
