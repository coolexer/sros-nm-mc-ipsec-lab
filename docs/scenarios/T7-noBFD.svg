<text x="40" y="507" font-size="15" fill="#64748b" text-anchor="start">Inner IP reaches the OA before encryption; the encrypted return packet uses the public Base instance</text>
<text x="40" y="620" font-size="16" fill="#64748b" text-anchor="start">Before hold expiration: core → dead seg1 = blackhole, even while seg2 is already OA. Only the recovered path is drawn</text>
