<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#001135"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F97316"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#001135">Redundancy logic as configured in the lab</text>
  <text x="30" y="64" font-size="13" fill="#475569">Behaviour per SR OS 26.7 MS-ISA/ESA guide, chapter "N:M MC-IPsec redundancy"</text>

  <!-- panel 1: election -->
  <rect x="20" y="85" width="370" height="455" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="38" y="112" font-size="15" font-weight="700" fill="#001135">1. Election / failover order</text>
  <text x="38" y="131" font-size="11.5" fill="#475569">DA preferred over DS, then priority, then router-id</text>

  <g filter="url(#sh)">
    <rect x="60" y="150" width="290" height="62" rx="10" fill="#00A36C"/>
    <rect x="60" y="268" width="290" height="62" rx="10" fill="#2563EB"/>
    <rect x="60" y="386" width="290" height="74" rx="10" fill="#64748B"/>
  </g>
  <text x="205" y="176" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">seg1 &#183; DA &#183; priority 200</text>
  <text x="205" y="196" font-size="11.5" fill="#ECFDF5" text-anchor="middle">operational active in steady state</text>
  <line x1="205" y1="214" x2="205" y2="264" stroke="#001135" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="215" y="236" font-size="11" fill="#1F2937">node / ISA failure,</text>
  <text x="215" y="250" font-size="11" fill="#1F2937">force-switchover</text>
  <text x="205" y="294" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">seg2 &#183; DA &#183; priority 100</text>
  <text x="205" y="314" font-size="11.5" fill="#DBEAFE" text-anchor="middle">hot: synced states already on its ISA</text>
  <line x1="205" y1="332" x2="205" y2="382" stroke="#001135" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="215" y="360" font-size="11" fill="#1F2937">both DAs lost</text>
  <text x="205" y="412" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">seg3 &#183; DS &#183; priority 200</text>
  <text x="205" y="431" font-size="11.5" fill="#F1F5F9" text-anchor="middle">takes the ISA from tunnel-member-pool,</text>
  <text x="205" y="447" font-size="11.5" fill="#F1F5F9" text-anchor="middle">states from CPM (or pre-loaded with HA)</text>
  <text x="38" y="492" font-size="11.5" fill="#475569">Non-revertive by default. Revertive challenger must be</text>
  <text x="38" y="508" font-size="11.5" fill="#475569">standby + nominal for 60 s. Changing "revertive"</text>
  <text x="38" y="524" font-size="11.5" fill="#B91C1C">toggles the domain admin-state (see finding F2).</text>

  <!-- panel 2: routing -->
  <rect x="410" y="85" width="380" height="455" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="428" y="112" font-size="15" font-weight="700" fill="#001135">2. Attracting traffic to the OA</text>
  <text x="428" y="131" font-size="11.5" fill="#475569">route policy on "protocol ipsec" routes, eBGP MED</text>

  <rect x="430" y="150" width="340" height="34" rx="6" fill="#0B2A6F"/>
  <text x="445" y="172" font-size="12" font-weight="700" fill="#FFFFFF">policy state</text>
  <text x="596" y="172" font-size="12" font-weight="700" fill="#FFFFFF">activity state</text>
  <text x="755" y="172" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">MED</text>

  <rect x="430" y="186" width="340" height="40" fill="#DCFCE7"/>
  <text x="445" y="211" font-size="12" fill="#14532D">ipsec-master-with-peer</text>
  <text x="596" y="211" font-size="12" fill="#14532D">active</text>
  <text x="755" y="211" font-size="14" font-weight="700" fill="#14532D" text-anchor="end">100</text>

  <rect x="430" y="228" width="340" height="40" fill="#FEF9C3"/>
  <text x="445" y="253" font-size="12" fill="#713F12">ipsec-master-without-peer</text>
  <text x="596" y="253" font-size="12" fill="#713F12">eligible</text>
  <text x="755" y="253" font-size="14" font-weight="700" fill="#713F12" text-anchor="end">200</text>

  <rect x="430" y="270" width="340" height="48" fill="#F1F5F9"/>
  <text x="445" y="292" font-size="12" fill="#334155">ipsec-non-master</text>
  <text x="596" y="292" font-size="12" fill="#334155">standby, discovery,</text>
  <text x="596" y="308" font-size="12" fill="#334155">notEligible</text>
  <text x="755" y="300" font-size="14" font-weight="700" fill="#334155" text-anchor="end">1000</text>

  <text x="428" y="350" font-size="12" fill="#1F2937">Applied to:</text>
  <text x="440" y="370" font-size="12" fill="#1F2937">&#8226; 198.51.100.1/32 (ipsec-gw, Base) &#8594; core public side</text>
  <text x="440" y="390" font-size="12" fill="#1F2937">&#8226; reverse routes 10.100.x.1/32 (VPRN) &#8594; core private side</text>
  <rect x="428" y="410" width="344" height="110" rx="10" fill="#FFF7E6" stroke="#F59E0B"/>
  <text x="442" y="432" font-size="12" font-weight="700" fill="#92400E">BFD on SecGW&#8211;core eBGP is essential</text>
  <text x="442" y="452" font-size="11.5" fill="#92400E">MIMP moves the OA in seconds, but without BFD</text>
  <text x="442" y="468" font-size="11.5" fill="#92400E">the core keeps the dead node's MED-100 route</text>
  <text x="442" y="484" font-size="11.5" fill="#92400E">until BGP hold-time expires when links stay up:</text>
  <text x="442" y="506" font-size="12" font-weight="700" fill="#92400E">~27 s outage without BFD vs ~2.9 s with BFD</text>

  <!-- panel 3: shunting -->
  <rect x="810" y="85" width="370" height="455" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="828" y="112" font-size="15" font-weight="700" fill="#001135">3. Shunting to the OA</text>
  <text x="828" y="131" font-size="11.5" fill="#475569">traffic that still lands on a standby node</text>

  <g filter="url(#sh)">
    <rect x="845" y="160" width="130" height="56" rx="10" fill="#FFFFFF" stroke="#00A36C" stroke-width="2"/>
    <rect x="845" y="300" width="130" height="62" rx="10" fill="#2563EB"/>
    <rect x="1020" y="300" width="130" height="62" rx="10" fill="#00A36C"/>
  </g>
  <text x="910" y="186" font-size="13" font-weight="700" fill="#001135" text-anchor="middle">core</text>
  <text x="910" y="204" font-size="11" fill="#475569" text-anchor="middle">best path = standby</text>
  <text x="910" y="326" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">standby</text>
  <text x="910" y="344" font-size="11" fill="#DBEAFE" text-anchor="middle">seg2 / seg3</text>
  <text x="1085" y="326" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">OA</text>
  <text x="1085" y="344" font-size="11" fill="#ECFDF5" text-anchor="middle">seg1</text>
  <line x1="910" y1="218" x2="910" y2="296" stroke="#001135" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="920" y="252" font-size="11" fill="#1F2937">ESP (public) or</text>
  <text x="920" y="266" font-size="11" fill="#1F2937">clear text (private)</text>
  <path d="M 977 331 L 1016 331" stroke="#F97316" stroke-width="3" fill="none" marker-end="url(#o)"/>
  <text x="997" y="388" font-size="11" font-weight="700" fill="#C2410C" text-anchor="middle">shunt over direct link A</text>

  <text x="828" y="420" font-size="12" fill="#1F2937">&#8226; public: Base "shunt-pub", VLAN 1 on link A</text>
  <text x="828" y="440" font-size="12" fill="#1F2937">&#8226; private: VPRN "shunt-priv", VLAN 3 on link A</text>
  <text x="828" y="460" font-size="12" fill="#1F2937">&#8226; covers BGP convergence after a switchover</text>
  <rect x="828" y="478" width="334" height="44" rx="8" fill="#ECFDF5" stroke="#00A36C"/>
  <text x="842" y="497" font-size="12" font-weight="700" fill="#065F46">Lab: 0 % loss with shunting,</text>
  <text x="842" y="514" font-size="12" font-weight="700" fill="#065F46">~85 % loss with the profile removed</text>
</svg>
