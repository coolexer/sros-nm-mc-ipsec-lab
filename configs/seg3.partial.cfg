configure {
    port 1/1/1 { admin-state enable ethernet { mode hybrid encap-type dot1q } }
    port 1/1/2 { admin-state enable ethernet { mode hybrid encap-type dot1q } }
    port 1/1/3 { admin-state enable ethernet { mode hybrid encap-type dot1q } }
    port 1/1/4 { admin-state enable ethernet { mode hybrid encap-type dot1q } }
    port 1/1/9 { admin-state enable ethernet { mode network } }
    port 1/1/10 { admin-state enable ethernet { mode access } }
    isa {
        tunnel-member-pool "pool1" {
            isa 1/2 { }
        }
        tunnel-group 1 {
            admin-state enable
            isa-scale-mode tunnel-limit-2k
            ipsec-responder-only true
            multi-active {
                active-isa-number 1
                member-pool "pool1"
            }
        }
    }
    ipsec {
        ike-transform 1 {
            dh-group group-14
            ike-auth-algorithm sha-256
            ike-encryption-algorithm aes-128
            isakmp-lifetime 172800
        }
        ipsec-transform 1 {
            esp-auth-algorithm sha-256
            esp-encryption-algorithm aes-128
            ipsec-lifetime 7200
        }
        ike-policy 1 {
            ike-transform [1]
            ike-version-2 { auth-method psk }
            dpd { interval 300 max-retries 3 reply-only true }
        }
        tunnel-template 1 {
            ipsec-transform [1]
            sp-reverse-route use-security-policy
        }
    }
    redundancy {
        multi-chassis {
            ipsec-domain 1 {
                admin-state enable
                designated-role standby
                priority 200
                tunnel-group 1
            }
            peer 10.0.0.1 {
                admin-state enable
                peer-name "seg1"
                sync {
                    admin-state enable
                    ipsec true
                }
                mc-ipsec {
                    bfd-liveness true
                    domain 1 { admin-state enable }
                }
            }
            peer 10.0.0.2 {
                admin-state enable
                peer-name "seg2"
                sync {
                    admin-state enable
                    ipsec true
                }
                mc-ipsec {
                    bfd-liveness true
                    domain 1 { admin-state enable }
                }
            }
        }
    }
    policy-options {
        policy-statement "accept-all" { default-action { action-type accept } }
        policy-statement "export-ipsec" {
            entry 10 {
                from { protocol { name [ipsec] } state ipsec-master-with-peer }
                action { action-type accept metric { set 100 } }
            }
            entry 20 {
                from { protocol { name [ipsec] } state ipsec-master-without-peer }
                action { action-type accept metric { set 200 } }
            }
            entry 30 {
                from { protocol { name [ipsec] } state ipsec-non-master }
                action { action-type accept metric { set 1000 } }
            }
            default-action { action-type reject }
        }
    }
    router "Base" {
        autonomous-system 64512
        router-id 10.0.0.3
        interface "system" { ipv4 { primary { address 10.0.0.3 prefix-length 32 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-seg1-a" { port 1/1/1:1 ipv4 { primary { address 10.13.1.1 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-seg1-b" { port 1/1/2:1 ipv4 { primary { address 10.13.2.1 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-seg2-a" { port 1/1/3:1 ipv4 { primary { address 10.23.1.1 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-seg2-b" { port 1/1/4:1 ipv4 { primary { address 10.23.2.1 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-core" { port 1/1/9 ipv4 { primary { address 172.31.3.1 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        ospf 0 {
            admin-state enable
            area 0.0.0.0 {
                interface "system" { passive true }
                interface "to-seg1-a" { interface-type point-to-point bfd-liveness { } }
                interface "to-seg1-b" { interface-type point-to-point bfd-liveness { } }
                interface "to-seg2-a" { interface-type point-to-point bfd-liveness { } }
                interface "to-seg2-b" { interface-type point-to-point bfd-liveness { } }
            }
        }
        bgp {
            group "core" {
                peer-as 65000
                bfd-liveness true
                import { policy ["accept-all"] }
                export { policy ["export-ipsec"] }
            }
            neighbor "172.31.3.0" { group "core" }
        }
        ipsec {
            multi-chassis-shunt-interface "to-seg1-a" { next-hop { address 10.13.1.0 } }
            multi-chassis-shunt-interface "to-seg2-a" { next-hop { address 10.23.1.0 } }
            multi-chassis-shunting-profile "shunt-pub" {
                peer 10.0.0.1 { multi-chassis-shunt-interface "to-seg1-a" }
                peer 10.0.0.2 { multi-chassis-shunt-interface "to-seg2-a" }
            }
        }
    }
    service {
        vprn "mobile" {
            admin-state enable
            service-id 100
            customer "1"
            autonomous-system 64512
            ipsec {
            multi-chassis-shunt-interface "shunt-seg1" { next-hop { address 10.113.1.0 } }
            multi-chassis-shunt-interface "shunt-seg2" { next-hop { address 10.123.1.0 } }
                multi-chassis-shunting-profile "shunt-priv" {
                peer 10.0.0.1 { multi-chassis-shunt-interface "shunt-seg1" }
                peer 10.0.0.2 { multi-chassis-shunt-interface "shunt-seg2" }
                }
            }
            interface "priv" {
                tunnel true
                multi-chassis-shunting-profile "shunt-priv"
                sap tunnel-1.private:1 { }
            }
            interface "to-core" { sap 1/1/10 { } ipv4 { primary { address 172.30.3.1 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "shunt-seg1" { sap 1/1/1:3 { } ipv4 { primary { address 10.113.1.1 prefix-length 31 } } }
        interface "shunt-seg2" { sap 1/1/3:3 { } ipv4 { primary { address 10.123.1.1 prefix-length 31 } } }
            bgp {
                group "core" {
                    peer-as 65000
                    bfd-liveness true
                    import { policy ["accept-all"] }
                    export { policy ["export-ipsec"] }
                }
                neighbor "172.30.3.0" { group "core" }
            }
        }
        ies "public" {
            admin-state enable
            service-id 10
            customer "1"
            interface "pub" {
                multi-chassis-shunting-profile "shunt-pub"
                ipv4 { primary { address 198.51.100.254 prefix-length 24 } }
                sap tunnel-1.public:1 {
                    ipsec-gateway "enb-gw" {
                        admin-state enable
                        default-tunnel-template 1
                        ike-policy 1
                        pre-shared-key "ChangeMe-LabPsk"
                        default-secure-service { service-name "mobile" interface "priv" }
                        local { gateway-address 198.51.100.1 }
                    }
                }
            }
        }
    }
}
