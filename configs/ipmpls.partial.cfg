configure {
    port 1/1/c1 { admin-state enable connector { breakout c1-100g } }
    port 1/1/c3 { admin-state enable connector { breakout c1-100g } }
    port 1/1/c5 { admin-state enable connector { breakout c1-100g } }
    port 1/1/c2 { admin-state enable connector { breakout c1-100g } }
    port 1/1/c4 { admin-state enable connector { breakout c1-100g } }
    port 1/1/c6 { admin-state enable connector { breakout c1-100g } }
    port 1/2/c1 { admin-state enable connector { breakout c1-100g } }
    port 1/2/c2 { admin-state enable connector { breakout c1-100g } }
    port 1/2/c3 { admin-state enable connector { breakout c1-100g } }
    port 1/1/c1/1 { admin-state enable ethernet { mode network } }
    port 1/1/c3/1 { admin-state enable ethernet { mode network } }
    port 1/1/c5/1 { admin-state enable ethernet { mode network } }
    port 1/2/c1/1 { admin-state enable ethernet { mode network } }
    port 1/2/c2/1 { admin-state enable ethernet { mode network } }
    port 1/1/c2/1 { admin-state enable ethernet { mode access } }
    port 1/1/c4/1 { admin-state enable ethernet { mode access } }
    port 1/1/c6/1 { admin-state enable ethernet { mode access } }
    port 1/2/c3/1 { admin-state enable ethernet { mode access } }
    policy-options {
        policy-statement "accept-all" { default-action { action-type accept } }
        policy-statement "export-direct" {
            entry 10 { from { protocol { name [direct] } } action { action-type accept } }
            default-action { action-type reject }
        }
    }
    router "Base" {
        autonomous-system 65000
        router-id 10.0.0.100
        interface "system" { ipv4 { primary { address 10.0.0.100 prefix-length 32 } } }
        interface "to-seg1" { port 1/1/c1/1 ipv4 { primary { address 172.31.1.0 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-seg2" { port 1/1/c3/1 ipv4 { primary { address 172.31.2.0 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-seg3" { port 1/1/c5/1 ipv4 { primary { address 172.31.3.0 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
        interface "to-enb1" { port 1/2/c1/1 ipv4 { primary { address 100.64.1.1 prefix-length 24 } } }
        interface "to-enb2" { port 1/2/c2/1 ipv4 { primary { address 100.64.2.1 prefix-length 24 } } }
        bgp {
            group "segw" {
                peer-as 64512
                bfd-liveness true
                import { policy ["accept-all"] }
                export { policy ["export-direct"] }
            }
            neighbor "172.31.1.1" { group "segw" }
            neighbor "172.31.2.1" { group "segw" }
            neighbor "172.31.3.1" { group "segw" }
        }
    }
    service {
        vprn "mobile" {
            admin-state enable
            service-id 100
            customer "1"
            autonomous-system 65000
            interface "to-seg1" { sap 1/1/c2/1 { } ipv4 { primary { address 172.30.1.0 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
            interface "to-seg2" { sap 1/1/c4/1 { } ipv4 { primary { address 172.30.2.0 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
            interface "to-seg3" { sap 1/1/c6/1 { } ipv4 { primary { address 172.30.3.0 prefix-length 31 } bfd { admin-state enable transmit-interval 100 receive 100 multiplier 3 } } }
            interface "to-mme" { sap 1/2/c3/1 { } ipv4 { primary { address 10.200.0.1 prefix-length 24 } } }
            bgp {
                group "segw" {
                    peer-as 64512
                    bfd-liveness true
                    import { policy ["accept-all"] }
                    export { policy ["export-direct"] }
                }
                neighbor "172.30.1.1" { group "segw" }
                neighbor "172.30.2.1" { group "segw" }
                neighbor "172.30.3.1" { group "segw" }
            }
        }
    }
}
