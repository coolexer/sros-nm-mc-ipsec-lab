name: nm-mc-ipsec

# SecGW N:M MC-IPsec lab: 3x 7750 SR-7 SR-SIM 26.7.R2, one MS-ISA2 (isa2-tunnel) each.
# seg1 = DA prio 200, seg2 = DA prio 100, seg3 = DS (tunnel-member-pool). Two MIMPv2/MCS links per SeGW pair.

mgmt:
  network: clab-secgw
  ipv4-subnet: 172.20.30.0/24
  ipv6-subnet: 3fff:172:20:30::/64

topology:
  kinds:
    nokia_srsim:
      image: registry.srlinux.dev/pub/nokia_srsim:26.7.R2
      license: license.txt # your own SR-SIM license, not part of this repo
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    seg1: &segw
      kind: nokia_srsim
      type: sr-7
      sfm: m-sfm6-7/12
      startup-config: configs/seg1.partial.cfg
      components:
        - slot: A
        - slot: 1
          type: iom4-e
          mda:
            - slot: 1
              type: me10-10gb-sfp+
            - slot: 2
              type: isa2-tunnel
    seg2:
      <<: *segw
      startup-config: configs/seg2.partial.cfg
    seg3:
      <<: *segw
      startup-config: configs/seg3.partial.cfg

    ipmpls:
      kind: nokia_srsim
      type: sr-1
      startup-config: configs/ipmpls.partial.cfg

    enb1:
      kind: linux
      image: enb-strongswan:local
      binds:
        - configs/enb1/swanctl.conf:/etc/swanctl/conf.d/segw.conf:ro
        - configs/enb-start.sh:/enb-start.sh:ro
      exec:
        - sh /enb-start.sh 1
    enb2:
      kind: linux
      image: enb-strongswan:local
      binds:
        - configs/enb2/swanctl.conf:/etc/swanctl/conf.d/segw.conf:ro
        - configs/enb-start.sh:/enb-start.sh:ro
      exec:
        - sh /enb-start.sh 2
    ntp:
      kind: linux
      image: enb-strongswan:local
      mgmt-ipv4: 172.20.30.123
      binds:
        - configs/chrony.conf:/etc/chrony/lab.conf:ro
      exec:
        - chronyd -x -f /etc/chrony/lab.conf
    mme:
      kind: linux
      exec:
        - ip addr add 10.200.0.10/24 dev eth1
        - ip route add 10.100.0.0/16 via 10.200.0.1

  links:
    # MIMPv2 + MCS + shunt, 2 links per SeGW pair
    - endpoints: ["seg1:1/1/1", "seg2:1/1/1"]
    - endpoints: ["seg1:1/1/2", "seg2:1/1/2"]
    - endpoints: ["seg1:1/1/3", "seg3:1/1/1"]
    - endpoints: ["seg1:1/1/4", "seg3:1/1/2"]
    - endpoints: ["seg2:1/1/3", "seg3:1/1/3"]
    - endpoints: ["seg2:1/1/4", "seg3:1/1/4"]
    # SeGW uplinks: 1/1/9 public (Base), 1/1/10 private (VPRN mobile)
    - endpoints: ["seg1:1/1/9", "ipmpls:1/1/c1/1"]
    - endpoints: ["seg1:1/1/10", "ipmpls:1/1/c2/1"]
    - endpoints: ["seg2:1/1/9", "ipmpls:1/1/c3/1"]
    - endpoints: ["seg2:1/1/10", "ipmpls:1/1/c4/1"]
    - endpoints: ["seg3:1/1/9", "ipmpls:1/1/c5/1"]
    - endpoints: ["seg3:1/1/10", "ipmpls:1/1/c6/1"]
    # RAN and core
    - endpoints: ["enb1:eth1", "ipmpls:1/2/c1/1"]
    - endpoints: ["enb2:eth1", "ipmpls:1/2/c2/1"]
    - endpoints: ["mme:eth1", "ipmpls:1/2/c3/1"]
